# ============================================================================
#  构建镜像并推到 GitHub Container Registry（可选，用法见 DEPLOY.md 方式 C）
# ----------------------------------------------------------------------------
#  触发条件：手动点「Run workflow」，或者推一个 v* 标签（例如 v1.0.1）。
#  平时提交不会触发，不浪费 Actions 额度。
#
#  镜像地址（注意仓库名必须全小写，下面用 bash 的 ${VAR,,} 转成小写）：
#    ghcr.io/<owner>/<repo>:<tag>
#
#  服务器上拉取前需要先登录（公开仓库可以把包设为 public 就不用登录）：
#    echo <你的 PAT> | docker login ghcr.io -u <github 用户名> --password-stdin
# ============================================================================
name: Docker 镜像

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 镜像名转小写（ghcr 不接受大写）
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 启用 Buildx（多架构需要）
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 常见云服务器两种架构都覆盖：x86_64 与 ARM（部分轻量应用服务器是 ARM）
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
