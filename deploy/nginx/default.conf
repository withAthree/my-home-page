# ============================================================================
#  my-home-page —— nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
# ----------------------------------------------------------------------------
#  托管的是 `next build` 的静态导出产物 out/：
#    /                  → index.html
#    /admin/            → admin/index.html
#    404.html           → 自定义 404
#    /_next/static/…    → 带内容哈希的 JS / CSS，可长缓存
#
#  trailingSlash: true —— 每个页面是「目录 + index.html」，所以 try_files
#  里带 $uri/；/admin 会被 nginx 自动 301 到 /admin/。
# ============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # 目录重定向（/admin → /admin/）一律用相对地址。
    # 否则 nginx 会按「容器内监听端口 80」拼出绝对地址：宿主机映射到 18090、
    # 或者前面套了 Caddy（443 / HTTPS）时，Location 会丢端口、丢 https。
    absolute_redirect off;

    # ---- 安全响应头 -------------------------------------------------------
    # 注意：nginx 的 add_header 是「整组继承」——只要在某个 location 里
    # 再写一条 add_header，server 级的这几条就会在该 location 里全部失效。
    # 所以下面的 location 一律只用 expires 控制缓存，不再写 add_header。
    add_header X-Content-Type-Options   "nosniff" always;
    # 后台「实时预览」是同源 iframe，不能用 DENY
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # CSP 说明：
    #   unsafe-inline  → Next 会在 HTML 里内联启动脚本（self.__next_f）和内联样式
    #   fonts.googleapis.com / fonts.gstatic.com → 站点的 Web 字体来自 Google Fonts
    #   若以后换成自托管字体，可以把这两项删掉收紧
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- 压缩 -------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml application/manifest+json
                      image/svg+xml;

    # ---- 容器健康检查 -----------------------------------------------------
    # 不读磁盘、不写日志，给 compose healthcheck / k8s probe 用
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 内容后台的写接口：静态部署里没有后端 ------------------------------
    # 必须返回 404（而不是回落到 index.html），前端据此自动切到「离线草稿模式」。
    # 详见 docs/ADMIN.md 第二节。
    location ^~ /api/ {
        access_log   off;
        default_type application/json;
        return 404 '{"ok":false,"mode":"static","message":"纯静态部署：后台写入接口不可用，已切换到离线草稿模式"}';
    }

    # ---- 带内容哈希的构建产物：一年缓存 ------------------------------------
    location ^~ /_next/static/ {
        access_log off;
        # 文件名里的 hash 每次构建都会变，缓存多久都不会读到旧代码
        expires    1y;
        try_files  $uri =404;
    }

    # ---- 构建清单（_buildManifest 等）：不主动缓存，靠 ETag 协商 -------------
    location ^~ /_next/ {
        try_files  $uri =404;
    }

    # ---- 站点素材：内容哈希之外的图片，换图时重名会读到旧图，30 天足够 ------
    location ^~ /images/ {
        expires    30d;
        try_files  $uri =404;
    }

    # ---- 页面本身：不缓存，保证重新部署后浏览器立刻拿到新版本 --------------
    location / {
        try_files  $uri $uri/ $uri.html =404;
        expires    -1;
    }

    # ---- 自定义 404 --------------------------------------------------------
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    # ---- 隐藏文件一律不对外 ------------------------------------------------
    location ~ /\. {
        deny       all;
        access_log off;
    }
}

# ============================================================================
#  可选：自带证书直接跑 HTTPS（不用 Caddy 时）
# ----------------------------------------------------------------------------
#  不要另起一个 443 的 server 块（那样所有 location 都得复制一遍），
#  直接把上面这个 server 改成下面这样：
#
#      listen              443 ssl;
#      listen              [::]:443 ssl;
#      http2               on;
#      ssl_certificate     /etc/nginx/certs/fullchain.pem;
#      ssl_certificate_key /etc/nginx/certs/privkey.pem;
#      ssl_protocols       TLSv1.2 TLSv1.3;
#      ssl_session_cache   shared:SSL:10m;
#      ssl_session_tickets off;
#      add_header          Strict-Transport-Security "max-age=31536000" always;
#
#  再补一个只做跳转的 80 server 块：
#
#      server {
#          listen      80;
#          listen      [::]:80;
#          server_name xuqingchu.dev www.xuqingchu.dev;
#          return      301 https://$host$request_uri;
#      }
#
#  容器里得有证书，docker-compose.yml 里加：
#      ports:   ["80:80", "443:443"]
#      volumes: ["/etc/letsencrypt/live/xuqingchu.dev:/etc/nginx/certs:ro"]
# ============================================================================
