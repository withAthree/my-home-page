<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="许清楚的抽象头像">
  <defs>
    <radialGradient id="bg" cx="34%" cy="26%" r="88%">
      <stop offset="0" stop-color="#2a336e"/>
      <stop offset="0.5" stop-color="#140e2e"/>
      <stop offset="1" stop-color="#05040f"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f72585" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f72585" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#dbe4ff"/>
      <stop offset="1" stop-color="#8b9bd0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- 光斑 -->
  <circle cx="200" cy="170" r="130" fill="#4cc9f0" opacity="0.22" filter="url(#soft)"/>
  <circle cx="430" cy="450" r="120" fill="#f72585" opacity="0.18" filter="url(#soft)"/>

  <!-- 轨道环 -->
  <ellipse cx="300" cy="300" rx="248" ry="98" fill="none" stroke="url(#ringA)" stroke-width="1.2" transform="rotate(-24 300 300)"/>
  <ellipse cx="300" cy="300" rx="238" ry="112" fill="none" stroke="url(#ringB)" stroke-width="1.2" transform="rotate(28 300 300)"/>
  <ellipse cx="300" cy="300" rx="212" ry="212" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- 星点 -->
  <g fill="#ffffff">
    <circle cx="112" cy="392" r="2.4" opacity="0.9"/>
    <circle cx="470" cy="188" r="2" opacity="0.7"/>
    <circle cx="392" cy="112" r="1.6" opacity="0.55"/>
    <circle cx="176" cy="466" r="1.6" opacity="0.5"/>
    <circle cx="508" cy="352" r="2.2" opacity="0.8"/>
  </g>

  <!-- 主体字 -->
  <text x="300" y="352" text-anchor="middle" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="228" font-weight="600" fill="url(#glyph)">黄</text>

  <!-- 落款 -->
  <text x="300" y="424" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="22" letter-spacing="12" fill="#93a3cf">HUANG KAI</text>
  <line x1="228" y1="452" x2="372" y2="452" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="300" y="484" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="15" letter-spacing="6" fill="#5f6a92">SOFTWARE ENGINEER</text>
</svg>
