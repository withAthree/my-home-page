<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="InkFlow 实时协作白板封面">
  <defs>
    <linearGradient id="if-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0616"/>
      <stop offset="0.5" stop-color="#170a24"/>
      <stop offset="1" stop-color="#05030c"/>
    </linearGradient>
    <linearGradient id="if-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f72585" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#f72585"/>
      <stop offset="0.75" stop-color="#b892ff"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="if-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="if-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#if-bg)"/>

  <!-- 网格点 -->
  <g fill="#ffffff" fill-opacity="0.07">
    <circle cx="100" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="300" cy="100" r="2"/>
    <circle cx="400" cy="100" r="2"/><circle cx="500" cy="100" r="2"/><circle cx="600" cy="100" r="2"/>
    <circle cx="700" cy="100" r="2"/><circle cx="800" cy="100" r="2"/><circle cx="900" cy="100" r="2"/>
    <circle cx="1000" cy="100" r="2"/><circle cx="1100" cy="100" r="2"/>
    <circle cx="100" cy="650" r="2"/><circle cx="200" cy="650" r="2"/><circle cx="300" cy="650" r="2"/>
    <circle cx="400" cy="650" r="2"/><circle cx="500" cy="650" r="2"/><circle cx="600" cy="650" r="2"/>
    <circle cx="700" cy="650" r="2"/><circle cx="800" cy="650" r="2"/><circle cx="900" cy="650" r="2"/>
    <circle cx="1000" cy="650" r="2"/><circle cx="1100" cy="650" r="2"/>
  </g>

  <!-- 手绘笔迹 -->
  <path d="M120 520 C 260 330, 380 640, 520 430 S 760 210, 900 330 S 1040 470, 1110 380"
        fill="none" stroke="#f72585" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round" filter="url(#if-glow)"/>
  <path d="M120 520 C 260 330, 380 640, 520 430 S 760 210, 900 330 S 1040 470, 1110 380"
        fill="none" stroke="url(#if-stroke)" stroke-width="4" stroke-linecap="round"/>

  <!-- 便签卡 -->
  <g transform="rotate(-7 330 250)">
    <rect x="200" y="170" width="260" height="160" rx="12" fill="url(#if-card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="228" y="204" width="150" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.42"/>
    <rect x="228" y="230" width="200" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="228" y="252" width="170" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="228" y="288" width="64" height="20" rx="10" fill="#f72585" fill-opacity="0.28"/>
  </g>

  <g transform="rotate(5 830 420)">
    <rect x="700" y="330" width="280" height="180" rx="12" fill="url(#if-card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="730" y="366" width="120" height="9" rx="4.5" fill="#4cc9f0" fill-opacity="0.7"/>
    <rect x="730" y="392" width="210" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="730" y="414" width="180" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="730" y="436" width="140" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <!-- 协作光标 -->
  <g>
    <path d="M470 470 l0 44 12-12 9 20 11-5 -9-20 17-2 z" fill="#4cc9f0"/>
    <rect x="496" y="502" width="86" height="26" rx="13" fill="#4cc9f0"/>
    <text x="508" y="520" font-family="'Space Grotesk',sans-serif" font-size="14" fill="#04121a">LIN</text>
  </g>
  <g>
    <path d="M930 180 l0 44 12-12 9 20 11-5 -9-20 17-2 z" fill="#f72585"/>
    <rect x="956" y="212" width="96" height="26" rx="13" fill="#f72585"/>
    <text x="968" y="230" font-family="'Space Grotesk',sans-serif" font-size="14" fill="#1a0210">YOU</text>
  </g>

  <text x="120" y="700" font-family="'Space Grotesk',sans-serif" font-size="17" letter-spacing="7" fill="#6b4a6f">INKFLOW / INFINITE CANVAS</text>
</svg>
